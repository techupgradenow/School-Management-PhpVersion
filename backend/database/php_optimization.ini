; PHP Performance Optimization for 500+ Concurrent Users
; EduManage Pro - School Management System
;
; Instructions:
; 1. Open C:\xampp\php\php.ini
; 2. Find and modify these settings (or add if not present)
; 3. Restart Apache via XAMPP Control Panel

[PHP]
; Memory Settings
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 64M
max_execution_time = 60
max_input_time = 60

; OpCache Settings (Critical for Performance)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
opcache.enable_file_override = 1
opcache.validate_timestamps = 1
opcache.save_comments = 1

; Realpath Cache (Reduces file system calls)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Session Settings
session.save_handler = files
session.save_path = "C:/xampp/tmp"
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 100

; Output Buffering
output_buffering = 4096

; Connection Settings
max_input_vars = 3000
max_file_uploads = 20

; Error Handling (Production)
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = "C:/xampp/php/logs/php_error.log"

; Date/Time
date.timezone = Asia/Kolkata

; Extensions (Uncomment if available)
; extension=php_redis.dll
; extension=php_apcu.dll
