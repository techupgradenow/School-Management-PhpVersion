# MySQL Performance Optimization for 500+ Concurrent Users
# EduManage Pro - School Management System
#
# Instructions:
# 1. Open C:\xampp\mysql\bin\my.ini (or C:\xampp\mysql\my.ini)
# 2. Add these settings under [mysqld] section
# 3. Restart MySQL via XAMPP Control Panel

[mysqld]
# Connection Settings
max_connections = 500
max_connect_errors = 100000
connect_timeout = 10
wait_timeout = 600
interactive_timeout = 600

# Thread Settings
thread_cache_size = 50
thread_stack = 256K

# Buffer Pool Settings (adjust based on RAM - use 50-70% of available RAM)
innodb_buffer_pool_size = 512M
innodb_buffer_pool_instances = 4
innodb_log_file_size = 128M
innodb_log_buffer_size = 16M
innodb_flush_log_at_trx_commit = 2
innodb_flush_method = O_DIRECT

# Query Cache (MySQL 5.7 and below - deprecated in 8.0)
query_cache_type = 1
query_cache_size = 128M
query_cache_limit = 2M

# Table Cache
table_open_cache = 4000
table_definition_cache = 2000

# Temporary Tables
tmp_table_size = 64M
max_heap_table_size = 64M

# MyISAM Settings
key_buffer_size = 32M
myisam_sort_buffer_size = 8M

# Read Buffer
read_buffer_size = 2M
read_rnd_buffer_size = 4M
sort_buffer_size = 4M
join_buffer_size = 4M

# Binary Logging (optional - for replication)
# log_bin = mysql-bin
# binlog_format = ROW
# expire_logs_days = 7

# Slow Query Log (for debugging)
slow_query_log = 1
slow_query_log_file = "C:/xampp/mysql/data/mysql-slow.log"
long_query_time = 2

# Performance Schema (for monitoring)
performance_schema = ON
performance_schema_max_table_instances = 500

# InnoDB Settings
innodb_file_per_table = 1
innodb_read_io_threads = 4
innodb_write_io_threads = 4
innodb_io_capacity = 200
innodb_io_capacity_max = 400

# Character Set
character_set_server = utf8mb4
collation_server = utf8mb4_unicode_ci

# Network Settings
max_allowed_packet = 64M
